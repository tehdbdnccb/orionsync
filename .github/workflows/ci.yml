name: OrionSync CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip" # Caches dependencies to speed up the runner
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest ruff httpx
        
    - name: Fast Lint with Ruff
      run: |
        # Fails the build immediately if syntax errors or bad imports are found
        ruff check src/
        
    - name: Run Integration & Unit Tests
      env:
        # Inject mock credentials so tests don't fail requiring a real .env
        ENVIRONMENT: "testing"
        TWILIO_ACCOUNT_SID: "mock_sid"
        TWILIO_AUTH_TOKEN: "mock_token"
        TWILIO_PHONE_NUMBER: "+1234567890"
        OPENAI_API_KEY: "mock_openai_key"
        DATABASE_URL: "sqlite:///:memory:"
      run: |
        pytest tests/ -v